name: Budgeting
options:
  bundleIdPrefix: com.robertoesquenazi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

configs:
  Debug: debug
  Release: release

packages:
  LinkKit:
    url: https://github.com/plaid/plaid-link-ios-spm.git
    from: 7.0.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_PREVIEWS: YES

targets:
  Budgeting:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Shared
      - path: Budgeting
    entitlements:
      path: Budgeting/Budgeting.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.robertoesquenazi.budgeting
        PRODUCT_NAME: Budgeting
        INFOPLIST_FILE: Budgeting/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - target: BudgetingWidgetExtension
        embed: true
      - package: LinkKit
    scheme:
      testTargets:
        - BudgetingTests
      gatherCoverageData: true

  BudgetingWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Shared
      - path: BudgetingWidget
    entitlements:
      path: BudgetingWidget/BudgetingWidget.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.robertoesquenazi.budgeting.widget
        PRODUCT_NAME: BudgetingWidget
        INFOPLIST_FILE: BudgetingWidget/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES

  BudgetingTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Shared
      - path: BudgetingTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.robertoesquenazi.budgeting.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Budgeting
